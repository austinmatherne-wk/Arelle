desktop:
  - name: "Windows 64-bit Installer"
    sub: "Standard setup wizard with GUI & PATH"
    format: ".EXE"
    category: "desktop"
    mirror_file: "arelle-win.exe"
  - name: "Windows 64-bit Portable"
    sub: "Standalone archive, no admin rights needed"
    format: ".ZIP"
    category: "desktop"
    mirror_file: "arelle-win.zip"
  - name: "macOS Apple Silicon"
    sub: "Native ARM64 for Macs"
    format: ".DMG"
    category: "desktop"
    mirror_file: "arelle-macos-arm64.dmg"
  - name: "macOS Intel x64"
    sub: "Universal disk image for x86_64 Macs"
    format: ".DMG"
    category: "desktop"
    mirror_file: "arelle-macos-x64.dmg"
  - name: "Ubuntu / Debian Linux"
    sub: "x86_64 pre-compiled tarball with libraries"
    format: ".TGZ"
    category: "desktop"
    mirror_file: "arelle-ubuntu.tgz"

mirrors:
  - label: "US"
    title: "US Amazon S3 Mirror"
    base_url: "https://arelle-us.s3-us-west-1.amazonaws.com/"
  - label: "EU"
    title: "Europe Amazon S3 Mirror"
    base_url: "https://arelle-eu.s3.eu-central-1.amazonaws.com/"
  - label: "CN"
    title: "Mainland China Alibaba Cloud OSS Mirror"
    base_url: "https://arelle-cn.oss-cn-shenzhen.aliyuncs.com/"

docker:
  - name: "Docker Full Image"
    sub: "Includes iXBRL Viewer, SEC EDGAR & XULE"
    format: "Docker"
    dockerhub: "docker pull arelleproject/arelle:latest"
    ghcr: "docker pull ghcr.io/arelle/arelle:latest"
  - name: "Docker Slim Image"
    sub: "Minimal core engine without optional plugins"
    format: "Docker"
    dockerhub: "docker pull arelleproject/arelle:latest-slim"
    ghcr: "docker pull ghcr.io/arelle/arelle:latest-slim"

packages:
  - name: "PyPI Python Package"
    sub: "Standard library for Python"
    format: "PyPI"
    command: "pip install arelle-release"
    extra_label: "GUI extra"
    extra_command: 'pip install "arelle-release[GUI]"'
  - name: "GitHub Source Tree"
    sub: "Clone repository for development and builds"
    format: "Git"
    command: "git clone https://github.com/Arelle/Arelle.git"
    link_url: "https://arelle.readthedocs.io/en/latest/install.html"
    link_text: "Build Documentation →"

plugins:
  - name: "Arelle iXBRL Viewer"
    desc: "Pre-bundled in desktop and full Docker. Easily installed for Python via <code>pip install ixbrl-viewer</code>."
    url: "https://github.com/Arelle/ixbrl-viewer"
    link_text: "Arelle iXBRL Viewer on GitHub →"
  - name: "XULE"
    desc: "Pre-bundled in desktop and full Docker. For custom setups, clone from the XBRL US repository."
    url: "https://github.com/xbrlus/xule"
    link_text: "XULE on GitHub →"
  - name: "SEC EDGAR"
    desc: "Pre-bundled in desktop and full Docker. EFM validation and viewer maintained by SEC staff."
    url: "https://github.com/arelle/edgar"
    link_text: "EDGAR on GitHub →"
