name: Build Website

on:
  pull_request:
    branches:
      - master
    paths:
      - '.github/actions/build_website/**'
      - '.github/workflows/build-website.yml'
      - 'docs/arelle.org/**'
      - 'pyproject.toml'
      - 'requirements-plugins.txt'
  workflow_call:
  workflow_dispatch:

permissions: {}

jobs:
  build-website:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # Full history so enableGitInfo can resolve .Lastmod and .GitInfo.
          fetch-depth: 0
      - name: Build website
        uses: ./.github/actions/build_website
        # Root-relative origin matches local `hugo --minify` and keeps the
        # Viewer home link on the artifact under test. Absolute production and
        # project-site URLs are checked by social-preview.test.mjs.
        # configure-pages, which publish-website.yml uses for the live origin,
        # must not run here: it needs pages: write and fails until a repo admin
        # enables Pages, which would turn every website PR red — permanently so
        # for fork PRs, whose token is read-only.
        with:
          base_url: /
      - parallel:
          - name: Check links with htmltest
            uses: wjdp/htmltest-action@v0.13.0-rc1
            with:
              config: docs/arelle.org/.htmltest.yml
              # The config's DirectoryPath is relative to htmltest's working
              # directory; this action runs from the repository root.
              path: docs/arelle.org/public
          - name: Check performance and accessibility with Lighthouse CI
            working-directory: docs/arelle.org
            run: npx lhci autorun
          - name: Test production artifact contracts
            working-directory: docs/arelle.org
            run: npm test
          # This site-wide legacy URL check stays with the PR gates. The
          # versioned download-page link check belongs to publish-website.yml,
          # where real release assets exist; running in parallel here means a
          # URL or performance regression cannot mask this result.
          - name: Check legacy URLs still resolve
            working-directory: docs/arelle.org
            run: npm run check:legacy-urls
