name: Publish Website

on:
  workflow_call:
    inputs:
      download_version:
        description: 'Release version to render in download links'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      download_version:
        default: ''
        description: 'Release version to render in download links (blank to use the latest tag)'
        required: false
        type: string

permissions: {}

# Serialize deployments and let queued runs finish rather than cancelling them,
# so a release deployment is never dropped by a manual correction dispatched
# behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish-website:
    environment: github-pages
    permissions:
      contents: read
      id-token: write
      pages: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # Full history so enableGitInfo can resolve .Lastmod and .GitInfo.
          fetch-depth: 0
          fetch-tags: true
      - name: Resolve download release version
        id: release-version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_DOWNLOAD_VERSION: ${{ inputs.download_version }}
        run: |
          version="$INPUT_DOWNLOAD_VERSION"
          if [[ "$EVENT_NAME" == "workflow_dispatch" && -z "$version" ]]; then
            version="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          fi
          if [[ -z "$version" ]]; then
            echo "A download release version is required, but none was provided or found in Git tags." >&2
            exit 1
          fi
          echo "download_version=$version" >> "$GITHUB_OUTPUT"
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6.0.0
      - name: Build website
        uses: ./.github/actions/build_website
        # This workflow owns the fail-closed download-page link check.
        # Site-wide htmltest, Lighthouse, and legacy URL checks stay in
        # build-website.yml. Manual dispatch is an explicit maintainer action
        # for content corrections between releases.
        with:
          base_url: ${{ steps.pages.outputs.base_url }}
          download_version: ${{ steps.release-version.outputs.download_version }}
      - name: Check versioned download links with htmltest
        uses: wjdp/htmltest-action@v0.13.0-rc1
        with:
          config: docs/arelle.org/.htmltest.download.yml
          # The config's DirectoryPath is relative to htmltest's working
          # directory; this action runs from the repository root.
          path: docs/arelle.org/public
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: docs/arelle.org/public
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v5.0.0
