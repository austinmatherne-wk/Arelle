name: Build Website
description: Builds the minified arelle.org site and generated Viewer demo into docs/arelle.org/public.
inputs:
  base_url:
    default: '/'
    description: Base URL to build the site against
    required: false
  download_version:
    default: ''
    description: Release version to render in download links (blank for the latest-release locator)
    required: false

runs:
  using: composite
  steps:
    - name: Install Hugo
      shell: bash
      run: sudo snap install hugo --channel=extended --classic
    - name: Install Node
      uses: actions/setup-node@v7.0.0
      with:
        cache: 'npm'
        cache-dependency-path: docs/arelle.org/package-lock.json
        check-latest: true
        node-version: '26'
    - name: Install Python
      uses: actions/setup-python@v6.0.0
      with:
        cache: 'pip'
        cache-dependency-path: requirements-plugins.txt
        python-version: '3.14'
    - name: Install dependencies
      shell: bash
      working-directory: docs/arelle.org
      run: npm ci
    - name: Install Arelle and Viewer
      shell: bash
      run: python -m pip install -r requirements-plugins.txt
    - name: Checkout EDGAR
      uses: actions/checkout@v7.0.1
      with:
        repository: Arelle/EDGAR
        path: arelle/plugin/EDGAR
        fetch-depth: 1
    - name: Build website
      shell: bash
      working-directory: docs/arelle.org
      env:
        BASE_URL: ${{ inputs.base_url }}
        DOWNLOAD_VERSION: ${{ inputs.download_version }}
      run: |
        if [[ -n "$DOWNLOAD_VERSION" ]]; then
          HUGO_PARAMS_downloadVersion="$DOWNLOAD_VERSION" hugo --minify --baseURL "$BASE_URL"
        else
          hugo --minify --baseURL "$BASE_URL"
        fi
    - name: Generate iXBRL Viewer demo
      shell: bash
      working-directory: docs/arelle.org
      env:
        BASE_URL: ${{ inputs.base_url }}
      run: python scripts/generate_viewer_demo.py . ../../arelle/plugin/EDGAR --base-url "$BASE_URL"
